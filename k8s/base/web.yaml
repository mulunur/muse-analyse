# The web application (FastAPI + uvicorn). The equivalent of the `muse-analyse`
# service in docker-compose.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: muse-analyse
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: muse-analyse
spec:
  replicas: 1
  # Recreate, for the same reason as Redis: the uploads and growth-state volumes
  # are attached by one node, and two pods at once during an update are not needed.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: muse-analyse
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: muse-analyse
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: muse-analyse
    spec:
      enableServiceLinks: false
      # The image runs as the appuser user (uid 10001, see the Dockerfile).
      # runAsUser has to be explicit: the image sets USER by name, not by number, and
      # without a number Kubernetes cannot verify runAsNonRoot.
      # fsGroup: volumes are mounted as root; fsGroup gives group 10001 write access,
      # otherwise the app could not create files in /app/uploads.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # The same image that docker-compose builds (target: runtime).
          # For kind/minikube you load it into the cluster by hand, see the README.
          image: muse-analyse:local
          imagePullPolicy: IfNotPresent
          # We do not override the command: the CMD from the Dockerfile (uvicorn) is used.
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: muse-config
            # The secret with the keys; optional, so the pod still starts without it.
            - secretRef:
                name: muse-secrets
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: growth-state
              mountPath: /app/data/growth
          # requests is how many resources are "guaranteed", and what the scheduler uses
          # to pick a node. limits.memory is a ceiling: a container that goes over it
          # is killed (OOMKilled). The values come from measurements: ~220-350 MB at idle;
          # adjust them using `kubectl top pod`.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # Probes hit /healthz: it asks nothing and answers in a fraction of a
          # millisecond. The detailed /api/health is not suitable for this: on every
          # call it goes to Ollama (2 s timeout) and to RAG, and when Ollama is silent
          # it freezes the whole web process for those 2 s (measured), so the probe
          # could "flap".
          # startupProbe gives startup up to 3 minutes (importing TensorFlow/Essentia);
          # liveness and readiness only kick in after it.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
        - name: growth-state
          persistentVolumeClaim:
            claimName: growth-state
---
# A Service is a permanent address for the web pod inside the cluster (type ClusterIP:
# not reachable from outside). It is exposed with port-forward or an Ingress,
# see the README.
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: muse-analyse
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: muse-analyse
spec:
  selector:
    app.kubernetes.io/name: muse-analyse
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8000
      targetPort: http
