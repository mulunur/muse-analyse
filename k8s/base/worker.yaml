# The Celery worker: runs track analysis and the Growth Copilot steps. The equivalent
# of the `worker` service in docker-compose.yml. It is the same image as web and
# differs only in the start command.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: muse-analyse
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: muse-analyse
spec:
  # One worker. Load is scaled by the number of replicas (see the README about KEDA),
  # not by the --concurrency flag: every pod has its own memory limit.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: muse-analyse
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: muse-analyse
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: muse-analyse
    spec:
      enableServiceLinks: false
      # On SIGTERM (pod shutdown) Celery finishes the task it is running.
      # Track analysis plus LLM calls take up to a minute or two, so we leave some slack,
      # otherwise the default (30 s) would cut the task off.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # The worker needs the same uploads and growth-state volumes as the web pod, and
      # they are RWO, reachable from one node only. podAffinity requires scheduling the
      # worker on the same node (kubernetes.io/hostname) as the web pod.
      # On a single-node cluster (kind, minikube, k3s on one VPS) the condition is met
      # on its own; on a multi-node one it keeps the pods from drifting apart.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: muse-analyse
                  app.kubernetes.io/component: web
      containers:
        - name: worker
          image: muse-analyse:local
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args:
            - -A
            - app.tasks
            - worker
            - --loglevel=info
            - --concurrency=1
          envFrom:
            - configMapRef:
                name: muse-config
            - secretRef:
                name: muse-secrets
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: growth-state
              mountPath: /app/data/growth
          # Worker memory grows with the length of the track: on macOS we measured ~290 MB
          # after startup and a ~460 MB peak on a 4-minute track (about 0.7 MB per
          # second of audio). A 1 GiB limit covers a track of roughly 15-17 minutes;
          # beyond that the container gets killed (OOMKilled).
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # We set no probes for the worker: it has no HTTP. If the celery process
          # exits, Kubernetes restarts the pod on its own. For a "hung but still
          # alive" worker people usually add an exec probe
          #   celery -A app.tasks inspect ping -d celery@$HOSTNAME
          # (importing app.tasks is cheap, we measured ~33 MB), but a badly configured
          # liveness probe restarts the pod in the middle of a task, and I have not
          # tested it on a live worker, so add it deliberately.
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
        - name: growth-state
          persistentVolumeClaim:
            claimName: growth-state
