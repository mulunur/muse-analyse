# Kustomize — встроенный в kubectl способ собрать набор манифестов вместе и
# накладывать поверх изменения (оверлеи/компоненты), не копируя файлы.
#   kubectl kustomize k8s/base   — показать итоговый YAML, ничего не применяя
#   kubectl apply -k k8s/base    — применить
#
# secret.example.yaml сюда намеренно не входит (см. комментарий в нём).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ставит этот namespace всем ресурсам ниже.
namespace: muse-analyse

resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - redis.yaml
  - web.yaml
  - worker.yaml
