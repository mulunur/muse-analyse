# kind / minikube с включённым RAG: база + компонент rag.
# Без RAG для kind/minikube отдельный оверлей не нужен — применяется сама
# база (`kubectl apply -k k8s/base`): манифесты у трёх кластеров одинаковые.
#
# Образ с RAG — отдельный target Dockerfile, под тегом :rag (как в compose):
#   docker build --target rag -t muse-analyse:rag .
#   kind load docker-image muse-analyse:rag        # или: minikube image load ...
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: muse-analyse

resources:
  - ../../base

components:
  - ../../components/rag
