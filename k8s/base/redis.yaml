# Redis: the broker and result store for Celery.
#
# A Deployment means "keep 1 copy of this pod running at all times and restart it
# if it dies".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: muse-analyse
spec:
  replicas: 1
  # Recreate: stop the old pod first, then create the new one. This is needed because
  # the redis-data volume can be attached by only one node (RWO), while the usual
  # RollingUpdate keeps two pods alive at the same time during an update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: redis
        app.kubernetes.io/part-of: muse-analyse
    spec:
      # Do not create environment variables like REDIS_PORT=tcp://10.0.0.5:6379
      # for every Service in the namespace: they sometimes break applications that
      # expect REDIS_PORT=6379. Addresses should only be resolved through DNS names.
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          # On start the image itself changes the owner of /data as root and then drops
          # privileges to the redis user, so we do not set a securityContext here
          # (unlike for web/worker).
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
# A Service is a permanent address for a group of pods. Pods come and go and change
# IP, but the Service named "redis" stays: you reach it as
# redis://redis:6379 (the name comes from metadata.name).
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: muse-analyse
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
