# A Job is a one-off task, "run and finish" (unlike a Deployment, which keeps a
# pod running all the time). The equivalent of the command from the README:
#   docker compose --profile rag run --rm muse-analyse-rag python scripts/index_knowledge.py
#
# To run it again (for example after the PDF changes): a Job cannot be modified, so
#   kubectl -n muse-analyse delete job index-knowledge
#   kubectl apply -k <your overlay>
# Follow the progress: kubectl -n muse-analyse logs job/index-knowledge -f
apiVersion: batch/v1
kind: Job
metadata:
  name: index-knowledge
  labels:
    app.kubernetes.io/name: muse-analyse
    app.kubernetes.io/component: index-knowledge
    app.kubernetes.io/part-of: muse-analyse
spec:
  # Do not restart forever on failure (for example when there is no network to download
  # the model): one retry, after that look at the logs.
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: muse-analyse
        app.kubernetes.io/component: index-knowledge
        app.kubernetes.io/part-of: muse-analyse
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # The rag-index and hf-cache volumes are RWO, so the Job has to land on the same
      # node as web (see the same block in worker.yaml).
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: muse-analyse
                  app.kubernetes.io/component: web
      containers:
        - name: index-knowledge
          image: muse-analyse:local   # the component swaps the tag to :rag
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/index_knowledge.py"]
          # --force rebuilds the index from scratch (so running it again is safe).
          args: ["--force"]
          envFrom:
            - configMapRef:
                name: muse-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: rag-index
              mountPath: /app/data/rag_index
            - name: hf-cache
              mountPath: /app/data/hf-cache
          resources:
            requests:
              memory: 1Gi
            limits:
              memory: 2560Mi
      volumes:
        - name: rag-index
          persistentVolumeClaim:
            claimName: rag-index
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache
