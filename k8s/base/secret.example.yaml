# A SAMPLE secret. This file is deliberately NOT part of kustomization.yaml:
# do not put real keys in it and do not commit them.
#
# It is easier to create the secret with a command (the keys then stay only in the cluster):
#
#   kubectl -n muse-analyse create secret generic muse-secrets \
#     --from-literal=LLM_PROVIDER=claude \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-...
#
# The Deployments pick the secret up through `secretRef ... optional: true`: without it
# the app still starts and returns the template review instead of an LLM review.
# Variables from the secret are read when the pod starts, so after creating or
# changing the secret you need to restart:
#
#   kubectl -n muse-analyse rollout restart deployment/web deployment/worker
apiVersion: v1
kind: Secret
metadata:
  name: muse-secrets
  namespace: muse-analyse
type: Opaque
stringData:
  LLM_PROVIDER: "claude"
  ANTHROPIC_API_KEY: "sk-ant-REPLACE-ME"
  # OPENAI_API_KEY: "sk-..."
  # NEMOTRON_API_KEY: "nvapi-..."
  # TAVILY_API_KEY: "tvly-..."   # search for trend_agent (Growth Copilot)
