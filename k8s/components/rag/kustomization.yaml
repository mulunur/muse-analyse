# A Component is an optional add-on on top of the base (the equivalent of the `rag`
# profile in docker-compose.yml). It is not applied by itself: an overlay pulls it in
# with a `components:` line, see overlays/local-rag (kind/minikube) and
# the commented-out block in overlays/k3s.
#
# What it changes:
#   1. image muse-analyse:local -> muse-analyse:rag (the `rag` target in the Dockerfile,
#      which also installs torch, sentence-transformers and chromadb);
#   2. RAG_ENABLED=true and the HuggingFace cache on a shared volume;
#   3. mounts the index and model-cache volumes into web and worker;
#   4. raises the memory limits (the worker with RAG takes ~1.4 GB in our measurements);
#   5. adds a Job that builds the index from the PDFs.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

images:
  - name: muse-analyse
    newTag: rag

resources:
  - pvc.yaml
  - index-job.yaml

patches:
  - path: configmap-patch.yaml
  - path: web-patch.yaml
  - path: worker-patch.yaml
