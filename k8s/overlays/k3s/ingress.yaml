# An Ingress is a rule: "HTTP requests from outside -> this Service". On its own it does
# nothing: you need an Ingress controller that carries the rules out.
# k3s ships with one out of the box: Traefik (ingressClassName: traefik).
#
# kind and minikube have no controller by default (in minikube: `minikube addons
# enable ingress` installs ingress-nginx, class "nginx"); it is simpler to use
# `kubectl port-forward` there, see the README.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  labels:
    app.kubernetes.io/part-of: muse-analyse
  annotations:
    # Only needed for ingress-nginx: its default request-body limit is
    # 1 MB, while tracks are uploaded up to 50 MB (MAX_UPLOAD_SIZE_MB). Traefik has no
    # default limit, so the annotation is harmless to it.
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
spec:
  ingressClassName: traefik
  rules:
    # No host: the rule catches any request by the server's IP/name.
    # For a domain, add the line `- host: muse.example.com` before `http:`.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
