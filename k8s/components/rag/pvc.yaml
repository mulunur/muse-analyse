# The textbook's vector index (about 30 MB in this project): written by the
# index-knowledge Job, read by web and worker.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-index
  labels:
    app.kubernetes.io/part-of: muse-analyse
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# The HuggingFace model cache. The embedding model is downloaded on first use
# (about half a gigabyte); on a shared volume it is downloaded once, not by every
# pod on every start.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-cache
  labels:
    app.kubernetes.io/part-of: muse-analyse
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 3Gi
