# A PersistentVolumeClaim (PVC) is a "request for a disk". A pod does not create the
# disk itself: it asks the cluster for a volume of a given size, and the cluster provides
# it through a StorageClass. storageClassName is left out on purpose, so the default
# class is used. kind, minikube and k3s each have one (a different one in each, but all
# of them are marked as the default), which keeps the manifest portable between them.
#
# ReadWriteOnce (RWO) = the volume can be attached from ONE node (several pods on
# that node can share it). That is exactly why the worker is pinned to the web pod's
# node (see affinity in worker.yaml): uploads and growth-state must be visible to both.

# Uploaded tracks. In docker-compose this was a tmpfs in RAM; in the cluster a volume
# shared between pods is a disk. The file is deleted right after processing, so
# little space is needed (the upload limit is 50 MB).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
  labels:
    app.kubernetes.io/part-of: muse-analyse
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
# The SQLite file with Growth Copilot state between /api/growth/start and /select.
# SQLite in WAL mode talks through a shared-memory file (-shm), so the web pod
# and the worker must be on ONE node and on a local disk. A network file system
# (NFS and the like) must not be used for this file; with several nodes you will
# need PostgreSQL (PostgresSaver in LangGraph).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: growth-state
  labels:
    app.kubernetes.io/part-of: muse-analyse
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# Redis data (dump.rdb snapshots). The queue survives a pod restart.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  labels:
    app.kubernetes.io/part-of: muse-analyse
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
