# kind / minikube with RAG enabled: the base plus the rag component.
# Without RAG you do not need a separate overlay for kind/minikube: the base itself
# is applied (`kubectl apply -k k8s/base`); the manifests are the same for all three clusters.
#
# The image with RAG is a separate Dockerfile target, tagged :rag (as in compose):
#   docker build --target rag -t muse-analyse:rag .
#   kind load docker-image muse-analyse:rag        # or: minikube image load ...
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: muse-analyse

resources:
  - ../../base

components:
  - ../../components/rag
