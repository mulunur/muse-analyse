# Regular (non-secret) settings. The equivalent of the `environment:` block
# in docker-compose.yml. Pods receive them as environment variables (envFrom).
#
# Secret values (API keys) do NOT go here; they come through a Secret,
# see secret.example.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: muse-config
  labels:
    app.kubernetes.io/name: muse-analyse
    app.kubernetes.io/part-of: muse-analyse
data:
  HOST: "0.0.0.0"
  PORT: "8000"
  MAX_UPLOAD_SIZE_MB: "50"

  # RAG is off, just like in the base compose service. The components/rag component
  # turns it on (and also swaps the image and mounts the index volumes).
  RAG_ENABLED: "false"
  RAG_INDEX_DIR: /app/data/rag_index
  # The PDF textbook is already inside the image (COPY data/knowledge in the Dockerfile).
  KNOWLEDGE_DIR: /app/data/knowledge

  # State file for Growth Copilot (SQLite). It lives on the growth-state volume,
  # which the web pod and the worker share, see pvc.yaml.
  GROWTH_CHECKPOINT_DB_PATH: /app/data/growth/checkpoints.sqlite3

  # Celery queue. "redis" is the name of the Service from redis.yaml: inside the cluster
  # pods find each other by service name (DNS), not by IP.
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1

  # --- LLM provider ---
  # LLM_PROVIDER: "ollama"
  # Ollama on your own machine, as seen from a kind/minikube pod:
  # OLLAMA_BASE_URL: "http://host.docker.internal:11434"
  # OLLAMA_MODEL: "gemma4:latest"
