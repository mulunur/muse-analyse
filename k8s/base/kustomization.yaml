# Kustomize is kubectl's built-in way to put a set of manifests together and
# layer changes on top (overlays / components) without copying files.
#   kubectl kustomize k8s/base   - show the final YAML without applying anything
#   kubectl apply -k k8s/base    - apply it
#
# secret.example.yaml is deliberately not included here (see the comment inside it).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Puts every resource below into this namespace.
namespace: muse-analyse

resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - redis.yaml
  - web.yaml
  - worker.yaml
