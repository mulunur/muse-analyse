# A patch on top of the worker Deployment: the RAG volumes and more memory.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  template:
    spec:
      containers:
        - name: worker
          volumeMounts:
            - name: rag-index
              mountPath: /app/data/rag_index
            - name: hf-cache
              mountPath: /app/data/hf-cache
          # Measured on macOS: the worker after its first RAG request takes ~1.37 GB
          # (without RAG ~0.3 GB), plus the working set of audio analysis (~0.7 MB per
          # second of track). That is why the limit is 2.5 GiB. On Linux the numbers may
          # differ: watch `kubectl top pod` and adjust.
          resources:
            requests:
              memory: 1536Mi
            limits:
              memory: 2560Mi
      volumes:
        - name: rag-index
          persistentVolumeClaim:
            claimName: rag-index
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache
