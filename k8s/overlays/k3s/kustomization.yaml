# Overlay for k3s: the same base plus an Ingress for Traefik. The manifests differ from
# kind/minikube in nothing else; the differences are in how the image gets into
# the cluster and how traffic arrives from outside (more in k8s/README.md).
#
#   kubectl apply -k k8s/overlays/k3s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace from the base only applies to its own resources, so the Ingress
# from this overlay has to be put in the same namespace separately.
namespace: muse-analyse

resources:
  - ../../base
  - ingress.yaml

# RAG (needs a server with spare memory, see k8s/README.md). Uncomment it
# and build the image: docker build --target rag -t muse-analyse:rag .
# components:
#   - ../../components/rag

# An image from a registry instead of a local one (uncomment it once the image is
# published, for example to the GitHub Container Registry; the address is an example):
#
# images:
#   - name: muse-analyse
#     newName: ghcr.io/YOUR_LOGIN/muse-analyse
#     newTag: v1
#
# Without this block you need to import the muse-analyse:local image into k3s once:
#   docker save muse-analyse:local | sudo k3s ctr images import -
