# ОБРАЗЕЦ секрета. Этот файл намеренно НЕ входит в kustomization.yaml:
# не кладите сюда настоящие ключи и не коммитьте их.
#
# Проще создать секрет командой (ключи останутся только в кластере):
#
#   kubectl -n muse-analyse create secret generic muse-secrets \
#     --from-literal=LLM_PROVIDER=claude \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-...
#
# Деплойменты подключают секрет через `secretRef ... optional: true`: без него
# приложение стартует и отдаёт шаблонный обзор вместо LLM-обзора.
# Переменные из секрета читаются при старте пода, поэтому после создания или
# изменения секрета нужен перезапуск:
#
#   kubectl -n muse-analyse rollout restart deployment/web deployment/worker
apiVersion: v1
kind: Secret
metadata:
  name: muse-secrets
  namespace: muse-analyse
type: Opaque
stringData:
  LLM_PROVIDER: "claude"
  ANTHROPIC_API_KEY: "sk-ant-ЗАМЕНИТЕ"
  # OPENAI_API_KEY: "sk-..."
  # NEMOTRON_API_KEY: "nvapi-..."
  # TAVILY_API_KEY: "tvly-..."   # поиск для trend_agent (Growth Copilot)
