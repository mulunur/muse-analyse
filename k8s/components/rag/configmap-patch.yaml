# A patch on top of the base ConfigMap: Kustomize merges `data` key by key.
# It changes RAG_ENABLED and adds HF_HOME.
apiVersion: v1
kind: ConfigMap
metadata:
  name: muse-config
data:
  RAG_ENABLED: "true"
  # Where huggingface / sentence-transformers store the models they download.
  HF_HOME: /app/data/hf-cache
