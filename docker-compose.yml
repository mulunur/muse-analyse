services:
  redis:
    image: redis:7-alpine
    # Only the Celery queue: broker + result backend. It is not where Growth Copilot
    # keeps its state (that is SQLite on the shared growth_state volume): plain Redis
    # has no RediSearch, which that job would need.
    restart: unless-stopped
    volumes:
      - redis_data:/data

  muse-analyse:
    platform: linux/amd64
    build:
      context: .
      target: runtime
    image: muse-analyse:local
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      RAG_ENABLED: "false"
      RAG_INDEX_DIR: /app/data/rag_index
      KNOWLEDGE_DIR: /app/data/knowledge
      GROWTH_CHECKPOINT_DB_PATH: /app/data/growth/checkpoints.sqlite3
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "${MUSE_PORT:-8000}:8000"
    volumes:
      - rag_index:/app/data/rag_index
      - growth_state:/app/data/growth
      - uploads:/app/uploads
      - ./data/knowledge:/app/data/knowledge:ro
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    platform: linux/amd64
    build:
      context: .
      target: runtime
    image: muse-analyse:local
    command: celery -A app.tasks worker --loglevel=info --concurrency=2
    env_file:
      - path: .env
        required: false
    environment:
      RAG_ENABLED: "false"
      RAG_INDEX_DIR: /app/data/rag_index
      KNOWLEDGE_DIR: /app/data/knowledge
      GROWTH_CHECKPOINT_DB_PATH: /app/data/growth/checkpoints.sqlite3
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - rag_index:/app/data/rag_index
      - growth_state:/app/data/growth
      # The same uploads volume as muse-analyse uses: one container queues the task,
      # another one runs it, so both must see the file.
      - uploads:/app/uploads
      - ./data/knowledge:/app/data/knowledge:ro
    depends_on:
      - redis
    restart: unless-stopped

  muse-analyse-rag:
    profiles: ["rag"]
    platform: linux/amd64
    build:
      context: .
      target: rag
    image: muse-analyse:rag
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      RAG_ENABLED: "true"
      RAG_INDEX_DIR: /app/data/rag_index
      KNOWLEDGE_DIR: /app/data/knowledge
      GROWTH_CHECKPOINT_DB_PATH: /app/data/growth/checkpoints.sqlite3
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "${MUSE_PORT:-8000}:8000"
    volumes:
      - rag_index:/app/data/rag_index
      - growth_state:/app/data/growth
      - uploads:/app/uploads
      - ./data/knowledge:/app/data/knowledge:ro
    depends_on:
      - redis
    restart: unless-stopped

  worker-rag:
    profiles: ["rag"]
    platform: linux/amd64
    build:
      context: .
      target: rag
    image: muse-analyse:rag
    command: celery -A app.tasks worker --loglevel=info --concurrency=2
    env_file:
      - path: .env
        required: false
    environment:
      RAG_ENABLED: "true"
      RAG_INDEX_DIR: /app/data/rag_index
      KNOWLEDGE_DIR: /app/data/knowledge
      GROWTH_CHECKPOINT_DB_PATH: /app/data/growth/checkpoints.sqlite3
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - rag_index:/app/data/rag_index
      - growth_state:/app/data/growth
      - uploads:/app/uploads
      - ./data/knowledge:/app/data/knowledge:ro
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  rag_index:
  redis_data:
  growth_state:
  # It used to be a tmpfs private to one container; now it is a named volume with the tmpfs driver:
  # files still never touch the disk and only live while docker compose is running,
  # but both the web process and the worker that processes them can see them.
  uploads:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=128m"
