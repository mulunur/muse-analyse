# A patch on top of the web Deployment: adds the RAG volumes and raises the memory limit.
# Containers are merged by name (web), volumes by name, mounts by path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      containers:
        - name: web
          volumeMounts:
            - name: rag-index
              mountPath: /app/data/rag_index
            - name: hf-cache
              mountPath: /app/data/hf-cache
          # Measured on macOS: the web process with RAG takes ~350 MB (the embedding model
          # is not loaded in it; only the worker loads it, when a request comes in).
          resources:
            requests:
              memory: 384Mi
            limits:
              memory: 768Mi
      volumes:
        - name: rag-index
          persistentVolumeClaim:
            claimName: rag-index
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache
